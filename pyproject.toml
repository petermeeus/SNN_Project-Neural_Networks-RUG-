[project]
name = "snn-project"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "imageio-ffmpeg>=0.7.0",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "snntorch",
    "tonic",
    "torch",
    "torchvision",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "pytest", "ruff"]
